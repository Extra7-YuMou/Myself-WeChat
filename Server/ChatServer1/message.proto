syntax = "proto3";

package message;

service VerifyService{
	rpc GetVerifyCode(GetVerifyReq) returns (GetVerifyRsp){}
}

message GetVerifyReq {
	string email = 1;
}

message GetVerifyRsp {
	int32 error = 1;
	string email = 2;
	string code = 3;
}

service StatusService{
	rpc GetChatServer(GetChatServerReq) returns (GetChatServerRsp) {}
	rpc Login(LoginReq) returns (LoginRsp){}
}

message GetChatServerReq{
	int32 uid = 1;
}

message GetChatServerRsp{
	int32 error = 1;
	string host = 2;
	string port = 3;
	string token = 4;
}

message LoginReq{
	int32 uid = 1;
	string token = 2;
}

message LoginRsp {
	int32 error = 1;
	int32 uid = 2;
	string token = 3;
}

service ChatService{
	rpc NotifyAddFriend(AddFriendReq) returns (AddFriendRsp){}
	rpc RelyAddFriend(ReplyFriendReq) returns (AddFriendRsp){}
	rpc SendChatMsg(SendChatMsgReq) returns (SendChatMsgRsp){}
	rpc NotifyAuthFriend(AuthFriendReq) returns (AuthFriendRsp){}
	rpc NotifyTextChatMsg(TextChatMsgReq) returns (TextChatMsgRsp){}
	rpc NotifyKickUser(KickUserReq) returns (KickUserRsp){}
	rpc NotifyImgChatMsg(ImgChatMsgReq) returns (ImgChatMsgRsp){}
}

message AddFriendReq{
	int32 fromuid = 1;
	string name = 2;
	string desc = 3;
	int32 touid = 4;
	string nick = 5;
	string icon = 6;
	int32 sex = 7;
}

message AddFriendRsp{
	int32 error = 1;
	int32 fromuid= 2;
	int32 touid = 3;
}

message ReplyFriendReq{
	int32 applyuid = 1;
	bool agree = 2;
	int32 touid = 3;
}

message ReplyFriendRsp{
	int32 error = 1;
	int32 replyuid = 2;
	int32 touid = 3;
}

message SendChatMsgReq{
	int32 fromuid = 1;
	int32 touid = 2;
	string message = 3;
}

message SendChatMsgRsp{
	int32 error = 1;
	int32 fromuid = 2;
	int32 touid = 3;
}

message AddFriendMsg{
	int32 send_id = 1;
	int64 thread_id = 2;
	int64 message_id = 3;
	string msgcontent = 4;
}

message AuthFriendReq{
	int32 fromuid = 1;
	int32 touid = 2;
	repeated AddFriendMsg textmsgs = 3;
}

message AuthFriendRsp{
	int32 error = 1;
	int32 fromuid = 2;
	int32 touid = 3;
}

message TextChatMsgReq{
	int32 fromuid = 1;
	int32 touid = 2;
	int64 thread_id = 3;
	repeated TextChatData textmsgs = 4;
}

message TextChatData{
	int64 msgid = 1;
	string msgcontent = 2;
	int32 type = 3;
}

message TextChatMsgRsp{
	int32 error = 1;
	int32 fromuid = 2;
	int32 touid = 3;
	int64 thread_id = 4;
	repeated TextChatData textmsgs = 5;
}

message KickUserReq{
	int32 uid = 1;
}

message KickUserRsp{
	int32 error = 1;
	int32 uid = 2;
}

message ImgChatData{
	int64 msgid = 1;
	string name = 2;
	int32 type = 3;
}

message ImgChatMsgReq{
	int32 selfuid = 1;
	int32 frienduid = 2;
	int64 thread_id = 3;
	repeated ImgChatData imgmsg = 4;
}

message ImgChatMsgRsp{
	int32 error = 1;
	int32 selfuid = 2;
	int32 frienduid = 3;
	int64 thread_id = 4;
	repeated ImgChatData imgmsg = 5;
}

service ResourceService{
	rpc NotifyChatImgMsg(GetChatImgMsgReq) returns (GetChatImgMsgRsp) {}
	rpc NotifyChatVideoMsg(GetChatVideoMsgReq) returns (GetChatVideoMsgRsp) {}
}

message GetChatImgMsgReq{
	int64 msg_id = 1;
	int32 uid = 2;
	int32 recv_uid = 3;
	string name = 4;
	int64 thread_id = 5;
	string md5 = 6;
	int64 total_size = 7;
}

message GetChatImgMsgRsp {
	int32 error = 1;
}

message GetChatVideoMsgReq{
	int64 msg_id = 1;
	int32 uid = 2;
	int32 recv_uid = 3;
	string name = 4;
	string cover_name = 5;
	int64 thread_id = 6;
	int32 duration = 7;
}

message GetChatVideoMsgRsp {
	int32 error = 1;
}